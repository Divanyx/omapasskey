name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Tag matches the setup script and the manifest
        run: |
          v="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' setup/omapasskey-setup)"
          test "v$v" = "$GITHUB_REF_NAME"
          grep -q "\"version\": \"$v\"" manifest.json
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Test
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Build
        run: ./scripts/build-release.sh
      - name: Rebuilt binaries are bit-identical to the pinned checksums
        run: diff <(cd dist && sha256sum -- * | sort -k2) <(sort -k2 setup/SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Install or update from the Omarchy bar (click the shield icon), or run
          \`setup/omapasskey-setup install\` from the plugin folder.

          The binaries are reproducible: this workflow rebuilt them from the tagged
          source and checked them against \`setup/SHA256SUMS\` before publishing.
          Verify their provenance with
          \`gh attestation verify omapasskeyd-linux-amd64 --repo ${GITHUB_REPOSITORY}\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* setup/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Omapasskey $GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag
